# Demonstração online no Render: https://render.com/deploy?repo=https://github.com/n5-brand/n5-controlo
# Cria a app e uma base de dados Postgres em Frankfurt, com dados de EXEMPLO.
services:
  - type: web
    name: n5-controlo
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: n5-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEMO_DATA
        value: "true"
      # Palavra-passe dos logins de exemplo: gerada pelo Render (Environment), nunca no repositório
      - key: DEMO_PASSWORD
        generateValue: true
databases:
  - name: n5-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
